[package]
name = "easy-copy"
version = "0.1.0"
description = "A clipboard manager built with Tauri"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "easy_copy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
base64 = "0.22"
clipboard-win = "5"
xcap = "0.0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "multipart"] }
# HTTP proxy dependencies
axum = "0.7"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring"] }
rustls = { version = "0.23", features = ["ring"] }
futures-util = "0.3"
http-body-util = "0.1"

# Release profile: optimise for binary size.
# opt-level="z" + lto + codegen-units=1 shrink the exe by ~40%.
# panic=abort removes unwind tables. strip removes debug symbols.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
